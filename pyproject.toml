[project]
name = "purr-api"
version = "0.1.0"
description = "An unofficial Python wrapper for the PurrBot API (api.purrbot.site) - not affiliated with or endorsed by the PurrBot team"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "build>=1.2.2.post1",
    "requests>=2.31.0",
    "twine>=6.1.0",
]
authors = [{ name = "Snupai", email = "nya@snupai.me" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = ["purrbot", "api", "wrapper", "discord", "images", "anime"]

[project.urls]
Homepage = "https://github.com/Snupai/purr-api"
Documentation = "https://github.com/Snupai/purr-api#readme"
Repository = "https://github.com/Snupai/purr-api.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
